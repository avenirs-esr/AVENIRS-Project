name: "Nightly Wiki + Deploy"

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      update_wiki:
        description: "Whether to update the wiki pages (true/false)"
        required: true
        default: false
        type: boolean
      update_epic_us_rules:
        description: "Whether to update the epic and US rules wiki pages (true/false)"
        required: true
        default: false
        type: boolean
      deploy_on_qualif:
        description: "Whether to deploy on qualif (true/false)"
        required: true
        default: false
        type: boolean

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  repository-projects: write

jobs:
  update-wiki:
    if: ${{ github.event.inputs.update_wiki || github.event_name == 'schedule' }}
    uses: avenirs-esr/avenirs-workflows/.github/workflows/update-wiki-from-project-workflow.yaml@main
    with:
      org: avenirs-esr
      project_number: "3"
      wiki_page: "4-‐-2-‐-Spécifications-fonctionnelles-:-Apprenants.md"
      profile_label: "Profil : Apprenant"
      epic_label: "Epic"
    secrets: inherit

  update-epic-us-rules:
    needs: update-wiki
    if: ${{ github.event.inputs.update_epic_us_rules || github.event_name == 'schedule' }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - mode: "full"
            wiki_page: "4-‐-4-‐-1---Spécifications-fonctionnelles-:-Epics-US-RG-Completes.md"
          - mode: "no-rules"
            wiki_page: "4-‐-4-‐-2---Spécifications-fonctionnelles-:-Epics-US-Sans-RG.md"
          - mode: "items-with-rules"
            wiki_page: "4-‐-4-‐-3---Spécifications-fonctionnelles-:-Epics-US-Avec-RG-uniquement.md"
    uses: avenirs-esr/avenirs-workflows/.github/workflows/update-wiki-epic-us-rules-workflow.yaml@main
    with:
      org: avenirs-esr
      project_number: "3"
      wiki_page: ${{ matrix.wiki_page }}
      epic_label: "Epic"
      us_label: "Story"
      mode: ${{ matrix.mode }}
    secrets: inherit

  deploy-on-qualif:
    if: ${{ github.event.inputs.deploy_on_qualif || github.event_name == 'schedule' }}
    uses: avenirs-esr/avenirs-workflows/.github/workflows/qualif-deployment-workflow.yaml@main
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_TOKEN: ${{ secrets.GH_APP_TOKEN }}
      SRV_BASE_PATH: ${{ secrets.SRV_BASE_PATH }}
      SRV_DEPLOY_CMD: ${{ secrets.SRV_DEPLOY_CMD }}
      SRV_UPDATE_DEPLOYMENT_CMD: ${{ secrets.SRV_UPDATE_DEPLOYMENT_CMD }}
      JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}
      EMPTY_DATASET_ACCESS_TOKEN: ${{ secrets.EMPTY_DATASET_ACCESS_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
      ROCKETCHAT_API_URL: ${{ secrets.ROCKETCHAT_API_URL }}
      ROCKETCHAT_TOKEN: ${{ secrets.ROCKETCHAT_TOKEN }}
      ROCKETCHAT_USER_ID: ${{ secrets.ROCKETCHAT_USER_ID }}
      WIKI_APP_ID: ${{ secrets.WIKI_APP_ID }}
      WIKI_APP_TOKEN: ${{ secrets.WIKI_APP_TOKEN }}
      COFOLIO_CLIENT_PATH: ${{ secrets.COFOLIO_CLIENT_PATH }}
      COFOLIO_VITE_API_URL: ${{ secrets.COFOLIO_VITE_API_URL }}
      SRV_DEV_PATH: ${{ secrets.SRV_DEV_PATH }}
      COFOLIO_CLIENT_SERVICE_NAME: ${{ secrets.COFOLIO_CLIENT_SERVICE_NAME }}