name: "Qualif Deployment Workflow"

on:
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests before deployment"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  repository-projects: write

jobs:
  deploy-on-qualif:
    uses: avenirs-esr/avenirs-workflows/.github/workflows/qualif-deployment-workflow.yaml@main
    with:
      run_e2e_tests: ${{ inputs.run_e2e_tests }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_TOKEN: ${{ secrets.GH_APP_TOKEN }}
      SRV_BASE_PATH: ${{ secrets.SRV_BASE_PATH }}
      SRV_DEPLOY_CMD: ${{ secrets.SRV_DEPLOY_CMD }}
      SRV_UPDATE_DEPLOYMENT_CMD: ${{ secrets.SRV_UPDATE_DEPLOYMENT_CMD }}
      JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}
      EMPTY_DATASET_ACCESS_TOKEN: ${{ secrets.EMPTY_DATASET_ACCESS_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
      ROCKETCHAT_API_URL: ${{ secrets.ROCKETCHAT_API_URL }}
      ROCKETCHAT_TOKEN: ${{ secrets.ROCKETCHAT_TOKEN }}
      ROCKETCHAT_USER_ID: ${{ secrets.ROCKETCHAT_USER_ID }}
      WIKI_APP_ID: ${{ secrets.WIKI_APP_ID }}
      WIKI_APP_TOKEN: ${{ secrets.WIKI_APP_TOKEN }}
      COFOLIO_CLIENT_PATH: ${{ secrets.COFOLIO_CLIENT_PATH }}
      COFOLIO_VITE_API_URL: ${{ secrets.COFOLIO_VITE_API_URL }}
      SRV_DEV_PATH: ${{ secrets.SRV_DEV_PATH }}
      COFOLIO_CLIENT_SERVICE_NAME: ${{ secrets.COFOLIO_CLIENT_SERVICE_NAME }}
