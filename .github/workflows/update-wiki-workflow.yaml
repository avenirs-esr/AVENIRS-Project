name: "Update US table in Wiki"

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  execution-decision:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    env:
      TZ: Europe/Paris
      RUN_HOURS: ${{ vars.WIKI_RUN_HOURS }}
    steps:
      - id: decide
        name: ⏱️ Decide to run or skip
        shell: bash
        run: |
          set -euo pipefail

          H_NOW=$(TZ="$TZ" date +%H)
          M_NOW=$(TZ="$TZ" date +%M)

          IFS=',' read -ra HOURS <<< "${RUN_HOURS// /}"
          should=false
          for hh in "${HOURS[@]}"; do
            hh=$(printf "%02d" "$((10#$hh))")
            if [[ "$H_NOW" == "$hh" ]]; then
              should=true
              break
            fi
          done

          echo "Heure locale: ${H_NOW}:${M_NOW} ($TZ)"
          echo "Heures ciblées: ${RUN_HOURS}"

          if $should; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Pass gate ✅"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skip gate ⏭️"
          fi

  update:
    needs: execution-decision
    if: needs.execution-decision.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    uses: avenirs-esr/avenirs-workflows/.github/workflows/update-wiki-from-project-workflow.yaml@main
    with:
      org: avenirs-esr
      project_number: "3"
      wiki_page: "4-‐-2-‐-Spécifications-fonctionnelles-:-Apprenants.md"
      profile_label: "Profil : Apprenant"
      epic_label: "Epic"
    secrets: inherit

  update-epic-us-rules:
    needs: execution-decision
    if: needs.execution-decision.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - mode: "full"
            wiki_page: "4-‐-4-‐-1---Spécifications-fonctionnelles-:-Epics-US-RG-Completes.md"
          - mode: "no-rules"
            wiki_page: "4-‐-4-‐-2---Spécifications-fonctionnelles-:-Epics-US-Sans-RG.md"
          - mode: "items-with-rules"
            wiki_page: "4-‐-4-‐-3---Spécifications-fonctionnelles-:-Epics-US-Avec-RG-uniquement.md"
    uses: avenirs-esr/avenirs-workflows/.github/workflows/update-wiki-epic-us-rules-workflow.yaml@main
    with:
      org: avenirs-esr
      project_number: "3"
      wiki_page: ${{ matrix.wiki_page }}
      epic_label: "Epic"
      us_label: "Story"
      mode: ${{ matrix.mode }}
    secrets: inherit