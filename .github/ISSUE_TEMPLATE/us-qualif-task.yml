name: "🧪 QUALIF Task"
description: Final task for MANUAL testing a User Story in dev environment before deployment in qualif.
title: "[QUALIF] Vérifier que l'US #<number> est complètement fonctionnelle sur dev"
labels:
  - Backend
  - Frontend
  - QUALIF
type: "task"
projects: ["AVENIRS-Project/16"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🧪 QUALIF Task – Cofolio

        Final MANUAL validation of a User Story in dev environment before deployment in qualification.
  - type: input
    id: story_number
    attributes:
      label: Story
      description: Reference the story number this test is related to
      value: "## Story: #"
      placeholder: "## Story: #"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: List the validation items to be checked in dev environment
      value: |
        Règles de gestion :
          - TODO: Répertorier toutes les RG de l'US

        Validation :
        Pour chaque RG, ajouter une preuve (capture d'écran, capture vidéo) de la bonne validation sur l'environnement dev
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        This task will validate the User Story in dev environment before qualification deployment. It will be automatically added to the 'Cofolio' project.
