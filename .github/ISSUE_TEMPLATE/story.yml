name: "📖 User Story"
about: Issue for describing a user stories.
title: "[US] "
labels:
  - story
type: "User Story"
projects: ["AVENIRS-Project/16", "AVENIRS-Project/3"]

body:
  - type: markdown
    attributes:
      value: |
        ### Epic *
        **Supprimer cette phrase et indiquer ici le hashtag et numéro de l'épic sans oublier de faire le lien dans les relationships**
  - type: markdown
    attributes:
      value: |
        ## Description de la User Story
  - type: textarea
    id: description
    attributes:
      label: Énoncé
      description: Phrase d'introduction de la fonctionnalité
      placeholder: |
        **En tant que [role],**
        
        **Je veux [une action ou fonctionnalité],**
        
        **Afin de [plus-value/bénéfice ou résulat].**
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Critères d'acceptance
        
        #### critères génériques
        - [ ] Accessibilité : Si applicable, vérification du respect des standards RGAA ou WCAG + test clavier et voix.
        - [ ] Performance : chargement raisonnable, fonctionnement sans lenteur.
        - [ ] Ergonomie/Mobile : rendu responsive, fonctionnel sur desktop, tablette et mobile.
        - [ ] Tests/Sécurité basique : pas de crash, pas d'erreur inattendue affichée (test d'insertion de valeurs non conformes).
        - [ ] Compatibilité navigateurs : tests sur les principaux navigateurs (Chromium, Google Chrome, Firefox, Edge, Safari) sur des versions qui ont moins de 6 mois, spécifiques desktop et mobile.
        
        #### critères spécifiques
  - type: textarea
    id: specific_criteria
    attributes:
      label: Critères spécifiques
      placeholder: |
        - [ ] Critère 1: Describe the first acceptance criterion here.
        - [ ] Critère 2: Describe the second acceptance criterion here.
        - [ ] Critère 3: Describe additional criteria as needed.
  - type: markdown
    attributes:
      value: |
        ### Definition du fini (DoD)
        - [ ] Critères d'acceptance tous remplis.
        - [ ] Code revu et approuvé.
        - [ ] Tests automatisés necessaires écrit et passés avec couverture suffisante.
        - [ ] Documentation mise à jour, si applicable.
        - [ ] Fonctionnalité déployée dans l'environnement de [environment name].
  - type: markdown
    attributes:
      value: |
        ### Éléments UI de travail
  - type: textarea
    id: ui_elements
    attributes:
      label: UI Elements
      placeholder: "[Lien Figma](URL_figma)"
