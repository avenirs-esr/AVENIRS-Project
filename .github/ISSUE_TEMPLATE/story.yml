name: "📖 User Story"
description: Issue for describing a user story.
title: "[US] "
labels:
  - story
type: "User Story"
projects: ["AVENIRS-Project/16", "AVENIRS-Project/3"]

body:
  - type: input
    id: epic
    attributes:
      label: "Epic lié"
      description: "ID ou lien vers l'epic (ex: #123)"
      placeholder: "#123"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ⚠️ Cette User Story doit être prête (Definition of Ready) avant développement.

        ## Description de la User Story

  - type: textarea
    id: user_story
    attributes:
      label: "User Story"
      description: "Formalisme standard, description et critères d'acceptation"
      placeholder: |
        **Formalisation: **
        En tant que ...
        Je souhaite ...
        Afin de ...

        **Description**
        Décrire précisément le comportement attendu


        **Critères d'acceptaiton**
        Given ...
        When ...
        Then ...
    validations:
      required: true

  - type: dropdown
    id: business_value
    attributes:
      label: "Valeur métier"
      options:
        - 🔴 Critique
        - 🟠 Importante
        - 🟡 Utile
        - 🟢 Confort
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: "Notes techniques"
      description: "Contraintes ou indications pour l'équipe technique"
      placeholder: "Optionnel"
    validations:
      required: false

  - type: textarea
    id: ui_elements
    attributes:
      label: UI Elements
      placeholder: "[Lien Figma](URL_figma)"

  - type: markdown
    attributes:
      value: |
        ### Référentiels projet

        - Definition of Ready (DoR) :
          https://avenirs-esr.github.io/dev-doc/quality/definition-of-ready-fr/

        - Definition of Done (DoD) :
          https://avenirs-esr.github.io/dev-doc/quality/definition-of-done-fr/
