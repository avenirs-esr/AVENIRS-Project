name: "📋 Task"
description: Issue for tasks.
title: '[TASK] '
labels:
  - task
type: 'Task'
projects: ["AVENIRS-Project/16", "AVENIRS-Project/3"]

body:
  - type: markdown
    attributes:
      value: |
        ## Story:

        ⚠️ Attachez cette tâche comme sous-issue de la User Story (bouton "Add sub-issue" en bas à droite de l'issue), sinon elle ne sera jamais prise en compte par l'automatisation.
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: ui_elements
    attributes:
      label: Éléments UI de travail
      description: Ajouter lien Figma et/ou images
      placeholder: "[lien Figma](URL_figma)"
