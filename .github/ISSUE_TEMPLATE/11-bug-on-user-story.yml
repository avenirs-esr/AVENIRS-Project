name: "🐞 Bug on User Story"
description: Report a Bug depending on an User Story
title: "[Bug] <short title>"
labels:
  - bug
type: "Task"
projects: ["AVENIRS-Project/16", "AVENIRS-Project/3"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug on User Story – Cofolio

        Bug report for a User Story developped during sprint

        ⚠️ Attach this task as a sub-issue of the User Story (using the "Add sub-issue" button at the bottom right of the issue); otherwise, it will never be picked up by the automation.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Brief description of the problem.
      placeholder: "Cofolio does not save trace correctly"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Steps to reproduce and actual behavior observed
      placeholder: |
        Steps to reproduce:
        1. Go to...
        2. Click on...
        3. See error...
        
        Actual Behavior:
        - Description of the problem
        - Screenshot (if applicable)
        - Stacktrace (if applicable)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The portfolio should be saved and visible in the dashboard."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thank you! This bug task will be automatically added to the 'Cofolio' project.
