name: "🛠️ Technical Story"
description: Issue for describing a Technical Story
title: "[ENABLER] "
labels:
  - enabler
type: "Enabler Story"
projects:
  - "AVENIRS-Project/16"
  - "AVENIRS-Project/3"

body:
  - type: markdown
    attributes:
      value: |
        ## Description de la Technical Story

        Une Technical Story décrit un travail technique nécessaire pour permettre, sécuriser ou faciliter l'évolution du produit.

        ⚠️ Attachez cette Technical Story comme sous-issue d'une EPIC (une fois crée, à droite dans l'issue, bouton "Relationships" puis "Add parent"), sinon elle ne sera jamais prise en compte par l'automatisation.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Décrire le besoin technique, la capacité à mettre en place et les éléments à réaliser."
      placeholder: |
        Exemple :
        Mettre en place le mécanisme permettant de ...
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: "Notes techniques"
      description: "Contraintes, choix techniques, impacts ou indications pour l'équipe technique."
      placeholder: |
        Contraintes ou indications techniques...
    validations:
      required: false

  - type: textarea
    id: ui_elements
    attributes:
      label: "UI Elements"
      description: "À renseigner uniquement si la Technical Story implique des éléments d'interface."
      placeholder: "[Lien Figma](URL_figma)"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Référentiels projet

        Les critères de Definition of Ready (DoR) et Definition of Done (DoD) s'appliquent à cette Technical Story selon sa nature

        - Definition of Ready (DoR) :
          https://avenirs-esr.github.io/dev-doc/quality/definition-of-ready-fr/

        - Definition of Done (DoD) :
          https://avenirs-esr.github.io/dev-doc/quality/definition-of-done-fr/
          
          ⚠️ Le **cycle process** de la DoD (sous-tâches, CI, `[QUALIF]`, nightly, qualification PO) s'applique intégralement à cet Enabler Story. Les critères orientés utilisateur (valeur métier, maquettes) et les exigences transverses UI (accessibilité, UX, compat. navigateurs) ne s'appliquent que si ce changement impacte l'interface utilisateur ou une API exposée.