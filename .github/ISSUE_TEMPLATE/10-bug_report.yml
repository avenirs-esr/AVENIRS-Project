name: "🐞 Bug Report"
description: Help us identify and fix bugs by filling out the details below.
title: "[Bug] <short title>"
labels:
  - bug
  - needs-triage
type: "Bug"
projects: ["AVENIRS-Project/16"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug Report – Cofolio

        Please fill out the following fields as thoroughly as possible.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Brief description of the problem.
      placeholder: "Cofolio does not save portfolios correctly..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Steps to reproduce and actual behavior observed
      placeholder: |
        Steps to reproduce:
        1. Go to...
        2. Click on...
        3. See error...
        
        Actual Behavior:
        - Description of the problem
        - Screenshot (if applicable)
        - Stacktrace (if applicable)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The portfolio should be saved and visible in the dashboard."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Details on browser, version, OS, etc.
      placeholder: "Chrome 118, Windows 10"
  - type: markdown
    attributes:
      value: |
        ### Référentiels projet

        - **Ready** : ce bug est considéré comme prêt à être pris en charge dès lors que les champs ci-dessus (résumé, étapes de reproduction, comportement attendu) sont remplis et que la sévérité est claire — la Definition of Ready générique (orientée valeur métier/maquettes) ne s'applique pas à un Bug.

        - **Done** : le cycle process de la Definition of Done s'applique (PR liée, CI verte, revue de code, nightly E2E, déploiement qualif, validation PO), **à l'exception de la sous-tâche `[QUALIF]`** qui n'est pas requise pour un Bug. Les exigences transverses (accessibilité, UX, sécurité, compat. navigateurs) s'appliquent si le correctif touche l'interface utilisateur ou une API exposée :
          https://avenirs-esr.github.io/dev-doc/quality/definition-of-done-fr/
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improving Cofolio! This issue will be automatically added to the 'Cofolio inter-sprint' project.
